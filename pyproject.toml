[project]
name = "cessation_manifold"
version = "0.1.0"
description = "Per-subject distance-from-cessation EEG readout with conformal honesty gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aayush Gandhi" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "mne>=1.5",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "antropy>=0.1.6",
    "nolds>=0.5.2",
]

[project.optional-dependencies]
microstates = ["pycrostates>=0.4"]
aperiodic = ["fooof>=1.1"]
bids = ["mne-bids>=0.14"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
